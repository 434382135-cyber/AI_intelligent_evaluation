<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雷达水位流速监测及电子水尺 3D 还原</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #ffffff;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        .label {
            position: absolute;
            color: #4a4a4a;
            font-size: 14px;
            pointer-events: none;
            user-select: none;
            white-space: nowrap;
            line-height: 1.5;
            text-shadow:
                -1px -1px 0 #fff,
                 1px -1px 0 #fff,
                -1px  1px 0 #fff,
                 1px  1px 0 #fff;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        /* --- 底部控制面板 UI 样式 --- */
        #control-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 100;
        }

        .control-label {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            line-height: 1.3;
        }

        #water-slider {
            -webkit-appearance: none;
            width: 250px;
            height: 10px;
            background: linear-gradient(to right, #1e88e5 50%, #e0e0e0 50%);
            border-radius: 5px;
            outline: none;
        }

        #water-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #1e88e5;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        #water-slider::-webkit-slider-thumb:active {
            transform: scale(1.1);
        }

        #auto-btn {
            background-color: #5DADE2;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            line-height: 1.4;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }

        #auto-btn:hover {
            background-color: #3498DB;
        }
        
        #auto-btn:active {
            transform: scale(0.96);
        }

        /* --- 预警提示横幅 (固定在顶部居中，不遮挡模型) --- */
        #warning-badge {
            position: absolute;
            top: 40px; 
            left: 50%;
            transform: translateX(-50%); 
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background-color 0.4s ease;
            z-index: 100;
            pointer-events: none;
            opacity: 1; /* 始终显示 */
        }

        /* --- 右侧阈值方案表格样式 --- */
        #threshold-panel {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            z-index: 100;
            border: 1px solid #e0e0e0;
        }

        #threshold-panel h3 {
            margin: 0 0 15px 0;
            font-size: 18px;
            color: #333;
            text-align: center;
        }

        #threshold-panel table {
            border-collapse: collapse;
            width: 100%;
            text-align: center;
        }

        #threshold-panel th, #threshold-panel td {
            border: 1px solid #ddd;
            padding: 10px 15px;
            font-size: 15px;
            color: #444;
        }

        #threshold-panel th {
            background-color: #f5f7fa;
            font-weight: bold;
        }

    </style>
    <!-- 引入 Three.js 和 OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="labels">
        <div class="label" id="label-level">雷达水位计</div>
        <div class="label" id="label-flow">雷达流速计</div>
        <div class="label" id="label-egauge">电子水尺</div>
    </div>

    <!-- 预警提示 -->
    <div id="warning-badge">
        <span id="warning-icon">🌊</span>
        <span id="warning-text">当前水位: 蓝色预警</span>
    </div>

    <!-- 右侧悬浮表格面板 -->
    <div id="threshold-panel">
        <h3>阈值方案</h3>
        <table>
            <thead>
                <tr>
                    <th>预警等级</th>
                    <th>水位条件 (cm)</th>
                    <th>触发时间</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td style="color: #1e90ff; font-weight: bold;">蓝色</td>
                    <td>7.5 ≤ H &lt; 10.0</td>
                    <td>即时</td>
                </tr>
                <tr>
                    <td style="color: #ffb300; font-weight: bold;">黄色</td>
                    <td>10.0 ≤ H &lt; 13.0</td>
                    <td>即时</td>
                </tr>
                <tr>
                    <td style="color: #ff8c00; font-weight: bold;">橙色</td>
                    <td>13.0 ≤ H &lt; 16.0</td>
                    <td>即时</td>
                </tr>
                <tr>
                    <td style="color: #dc143c; font-weight: bold;">红色</td>
                    <td>H ≥ 16.0</td>
                    <td>即时</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 底部控制面板 -->
    <div id="control-panel">
        <div class="control-label">调节水位<br>(cm):</div>
        <!-- 范围设置：匹配阈值表，H从5.0(河底)到17.3(漫溢封顶) -->
        <input type="range" id="water-slider" min="5.0" max="17.3" step="0.01" value="8.0">
        <button id="auto-btn">自动演示<br>洪水</button>
    </div>

    <script>
        // --- 场景基础设置 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        const aspect = window.innerWidth / window.innerHeight;
        const d = 30; 
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
        camera.position.set(40, 30, 40);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = false; 
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.1; 

        // --- 灯光设置 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight.position.set(20, 40, -20);
        scene.add(dirLight);
        const fillLight = new THREE.DirectionalLight(0xe0e8f0, 0.3);
        fillLight.position.set(-20, 20, 20);
        scene.add(fillLight);

        // --- 材质与常量定义 ---
        const colors = {
            bankTop: 0xf5f6f8, bankSlope: 0xe0e3e8, dirt: 0x8b7355,
            grass: 0x7cb342, water: 0x98d9dc, pole: 0x858f99,
            box: 0xfdfdfd, solarPanel: 0x8ca3b8, beam: 0x66a3ff,
            arrow: 0x000000, mark: 0xd0d5db
        };

        const matBankTop = new THREE.MeshLambertMaterial({ color: colors.bankTop });
        const matBankSlope = new THREE.MeshLambertMaterial({ color: colors.bankSlope });
        const matDirt = new THREE.MeshLambertMaterial({ color: colors.dirt });
        const matGrass = new THREE.MeshLambertMaterial({ color: colors.grass });
        
        const sceneGroup = new THREE.Group();
        scene.add(sceneGroup);

        const channelLength = 70;
        const topWidth = 18;
        const bottomWidth = 20;
        const depth = 8;
        const slopeWidth = 11.31;

        // --- 构建堤岸和河道 ---
        const bankDirtHeight = 1;
        const leftBankGeo = new THREE.BoxGeometry(topWidth, 1, channelLength);
        const leftBank = new THREE.Mesh(leftBankGeo, matBankTop);
        leftBank.position.set(-bottomWidth/2 - slopeWidth - topWidth/2, depth, 0);
        sceneGroup.add(leftBank);

        const leftBankDirtGeo = new THREE.BoxGeometry(topWidth, bankDirtHeight, channelLength);
        const leftBankDirt = new THREE.Mesh(leftBankDirtGeo, matDirt);
        leftBankDirt.position.set(-bottomWidth/2 - slopeWidth - topWidth/2, depth + bankDirtHeight/2 + 0.5, 0);
        sceneGroup.add(leftBankDirt);

        const leftGrassGeo = new THREE.PlaneGeometry(topWidth, channelLength);
        const leftGrass = new THREE.Mesh(leftGrassGeo, matGrass);
        leftGrass.rotation.x = -Math.PI / 2;
        leftGrass.position.set(-bottomWidth/2 - slopeWidth - topWidth/2, depth + bankDirtHeight + 0.5, 0);
        sceneGroup.add(leftGrass);

        const slopeGeo = new THREE.BoxGeometry(slopeWidth * 1.414, 1, channelLength);
        const leftSlope = new THREE.Mesh(slopeGeo, matBankSlope);
        leftSlope.position.set(-bottomWidth/2 - slopeWidth/2, 2.34, 0);
        leftSlope.rotation.z = -Math.PI / 4; 
        sceneGroup.add(leftSlope);

        const rightSlope = new THREE.Mesh(slopeGeo, matBankSlope);
        rightSlope.position.set(bottomWidth/2 + slopeWidth/2, 2.34, 0);
        rightSlope.rotation.z = Math.PI / 4;
        sceneGroup.add(rightSlope);

        const rightBank = new THREE.Mesh(leftBankGeo, matBankTop);
        rightBank.position.set(bottomWidth/2 + slopeWidth + topWidth/2, depth, 0);
        sceneGroup.add(rightBank);

        const rightBankDirtGeo = new THREE.BoxGeometry(topWidth, bankDirtHeight, channelLength);
        const rightBankDirt = new THREE.Mesh(rightBankDirtGeo, matDirt);
        rightBankDirt.position.set(bottomWidth/2 + slopeWidth + topWidth/2, depth + bankDirtHeight/2 + 0.5, 0);
        sceneGroup.add(rightBankDirt);

        const rightGrassGeo = new THREE.PlaneGeometry(topWidth, channelLength);
        const rightGrass = new THREE.Mesh(rightGrassGeo, matGrass);
        rightGrass.rotation.x = -Math.PI / 2;
        rightGrass.position.set(bottomWidth/2 + slopeWidth + topWidth/2, depth + bankDirtHeight + 0.5, 0);
        sceneGroup.add(rightGrass);

        const bedGeo = new THREE.BoxGeometry(bottomWidth, 1, channelLength);
        const bed = new THREE.Mesh(bedGeo, new THREE.MeshLambertMaterial({ color: 0x8b7355 }));
        bed.position.y = -3.0; // 严格对齐底座
        sceneGroup.add(bed);

        function createGroundMarks(offsetX) {
            const markGeo = new THREE.PlaneGeometry(2, 1);
            const markMat = new THREE.MeshBasicMaterial({color: colors.mark});
            for(let i=0; i<3; i++) {
                const mark = new THREE.Mesh(markGeo, markMat);
                mark.rotation.x = -Math.PI / 2;
                mark.position.set(offsetX, depth + 0.51, -20 + i * 20); 
                sceneGroup.add(mark);
            }
        }
        createGroundMarks(-bottomWidth/2 - slopeWidth - 5);
        createGroundMarks(bottomWidth/2 + slopeWidth + 5);

        // --- 初始化动态水面材质及对象 ---
        const waterShaderMat = new THREE.ShaderMaterial({
            uniforms: { uTime: { value: 0 } },
            vertexShader: `
                varying float vHeight;
                uniform float uTime;
                void main() {
                    float wave1 = sin(uv.x * 12.0 + uTime * 1.5) * cos(uv.y * 10.0 + uTime * 0.8) * 0.12;
                    float wave2 = sin(uv.x * 6.0 - uTime * 1.0) * sin(uv.y * 7.0 + uTime * 0.6) * 0.08;
                    float wave3 = cos(uv.x * 18.0 + uTime * 1.8) * sin(uv.y * 14.0 - uTime * 1.2) * 0.06;
                    float displacement = wave1 + wave2 + wave3;
                    vHeight = displacement;
                    vec3 newPosition = position + normal * displacement * 1.5;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
                }
            `,
            fragmentShader: `
                varying float vHeight;
                void main() {
                    float shade = 0.85 + vHeight * 0.8;
                    gl_FragColor = vec4(0.596 * shade, 0.851 * shade, 0.863 * shade, 0.9);
                }
            `,
            transparent: true, depthWrite: true, side: THREE.DoubleSide
        });
        
        const water = new THREE.Mesh(new THREE.BufferGeometry(), waterShaderMat);
        water.rotation.x = -Math.PI / 2;
        sceneGroup.add(water);

        const waterBodyMat = new THREE.MeshLambertMaterial({ color: 0x6db8c0, transparent: true, opacity: 0.8 });
        const waterBody = new THREE.Mesh(new THREE.BufferGeometry(), waterBodyMat);
        waterBody.position.z = -channelLength / 2;
        sceneGroup.add(waterBody);


        // --- 电子水尺构建 ---
        const eGaugeGroup = new THREE.Group();
        const eGaugeX = 8;
        const eGaugeZ = 35; // 位于截面
        eGaugeGroup.position.set(eGaugeX, 0, eGaugeZ);
        sceneGroup.add(eGaugeGroup);

        // 【修改点】：略微加宽尺身物理宽度，使超大号数字显得更自然
        const gaugeWidth = 3.2; 
        const gaugeDepth = 0.3; 
        const gaugeTotalHeight = 18.0; 
        const gaugeStartY = -3.0; // 从河床起步

        // 水尺表面刻度和数字
        function createGaugeTexture() {
            const canvas = document.createElement('canvas');
            // 【修改点】：增加宽度，容纳极大的数字
            canvas.width = 1024;
            canvas.height = 8192;
            const ctx = canvas.getContext('2d');

            // 背景色为白色
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 标尺拉长后，区块数量相应增加，覆盖从 23.0 向下到 5.0 (共 36 个区块)
            const totalBlocks = 36; 
            const blockH = canvas.height / totalBlocks; 

            for(let i = 0; i < totalBlocks; i++) {
                // 当前刻度块底部的数值 (从 H=23.0 递减至 5.0)
                const h_bottom = 23.0 - (i + 1) * 0.5; 
                
                let bgColor, fgColor;
                if (h_bottom >= 16.0) {
                    bgColor = '#dc143c'; fgColor = '#ffffff'; // 红色
                } else if (h_bottom >= 13.0) {
                    bgColor = '#ff8c00'; fgColor = '#ffffff'; // 橙色
                } else if (h_bottom >= 10.0) {
                    bgColor = '#ffb300'; fgColor = '#ffffff'; // 黄色
                } else if (h_bottom >= 7.5) {
                    bgColor = '#1e90ff'; fgColor = '#ffffff'; // 蓝色 (起始点改为 7.5)
                } else {
                    bgColor = '#ffffff'; fgColor = '#333333'; // 正常白色，黑色字
                }

                ctx.fillStyle = bgColor;
                const y = i * blockH; 
                ctx.fillRect(0, y, canvas.width, blockH); 

                ctx.fillStyle = fgColor;
                // E图案占用的宽度相对压缩
                const eW = 260; 
                const unit = blockH / 5; 

                // 绘制刻度的 E 形图案
                if (i % 2 === 0) {
                    ctx.fillRect(0, y, eW/3, blockH); 
                    ctx.fillRect(eW/3, y, eW*2/3, unit); 
                    ctx.fillRect(eW/3, y + unit*2, eW*2/3, unit); 
                    ctx.fillRect(eW/3, y + unit*4, eW*2/3, unit); 
                } else {
                    ctx.fillRect(eW*2/3, y, eW/3, blockH); 
                    ctx.fillRect(0, y, eW*2/3, unit); 
                    ctx.fillRect(0, y + unit*2, eW*2/3, unit); 
                    ctx.fillRect(0, y + unit*4, eW*2/3, unit); 
                }

                // 只在阈值处显示数字
                const thresholds = [7.5, 10.0, 13.0, 16.0];
                const isThreshold = thresholds.some(t => Math.abs(h_bottom - t) < 0.1); 

                if (isThreshold) {
                    // 【修改点】：极限放大字体为 340px，并在充足空间内渲染
                    ctx.font = 'bold 340px Arial'; 
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    // 文字居中计算 (260 + 剩余宽度的中心)
                    ctx.fillText(h_bottom.toFixed(1), 642, y + blockH/2 + 30);
                }
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter; 
            texture.minFilter = THREE.LinearFilter;
            return texture;
        }

        const gaugeTexture = createGaugeTexture();
        const matGaugeFace = new THREE.MeshLambertMaterial({ map: gaugeTexture });
        const matGaugeSide = new THREE.MeshLambertMaterial({ color: 0xffffff }); 
        const gaugeMaterials = [matGaugeSide, matGaugeSide, matGaugeSide, matGaugeSide, matGaugeFace, matGaugeFace];

        const gaugeMesh = new THREE.Mesh(new THREE.BoxGeometry(gaugeWidth, gaugeTotalHeight, gaugeDepth), gaugeMaterials);
        gaugeMesh.position.y = gaugeStartY + gaugeTotalHeight / 2;
        eGaugeGroup.add(gaugeMesh);

        // 电子水尺顶部控制箱 
        const topBoxGroup = new THREE.Group();
        topBoxGroup.position.y = gaugeStartY + gaugeTotalHeight + 1.4;
        eGaugeGroup.add(topBoxGroup);

        const backPlate = new THREE.Mesh(new THREE.BoxGeometry(3.6, 2.4, 0.1), new THREE.MeshLambertMaterial({ color: 0xa0a0a0 }));
        backPlate.position.z = -0.2;
        topBoxGroup.add(backPlate);

        const topBox = new THREE.Mesh(new THREE.BoxGeometry(3.0, 1.8, 0.6), new THREE.MeshLambertMaterial({ color: 0xfdfdfd }));
        topBoxGroup.add(topBox);

        const frontPanel = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 0.8), new THREE.MeshBasicMaterial({ color: 0x4169e1 }));
        frontPanel.position.set(0, 0.1, 0.31); 
        topBoxGroup.add(frontPanel);

        const cable = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 1.0), new THREE.MeshLambertMaterial({ color: 0x222222 }));
        cable.position.y = -1.0;
        topBoxGroup.add(cable);


        // --- 雷达监测设备 ---
        const equipGroup = new THREE.Group();
        const poleX = -bottomWidth/2 - slopeWidth - 5;
        const poleZ = -10;
        equipGroup.position.set(poleX, depth + 0.5, poleZ); 
        sceneGroup.add(equipGroup);

        const matPole = new THREE.MeshLambertMaterial({ color: colors.pole });
        
        const base = new THREE.Mesh(new THREE.BoxGeometry(4, 0.5, 4), new THREE.MeshLambertMaterial({color: 0xffffff}));
        base.position.y = 1.0;
        equipGroup.add(base);

        const poleHeight = 22;
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, poleHeight, 16), matPole);
        pole.position.y = poleHeight / 2;
        equipGroup.add(pole);

        const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 5), matPole);
        antenna.position.y = poleHeight + 2.5;
        equipGroup.add(antenna);

        const controlBox = new THREE.Mesh(new THREE.BoxGeometry(4, 6, 3), new THREE.MeshLambertMaterial({ color: colors.box }));
        controlBox.position.set(1, poleHeight * 0.6, 0); 
        equipGroup.add(controlBox);

        const panelGroup = new THREE.Group();
        panelGroup.position.set(0, poleHeight - 1, 0);
        panelGroup.rotation.x = Math.PI / 6; 
        equipGroup.add(panelGroup);

        const panel = new THREE.Mesh(new THREE.BoxGeometry(8, 0.4, 6), new THREE.MeshLambertMaterial({ color: colors.solarPanel }));
        panel.position.set(-2, 1, 0);
        panelGroup.add(panel);

        const armLength = Math.abs(poleX) + 5; 
        const arm = new THREE.Mesh(new THREE.BoxGeometry(armLength, 0.6, 0.6), matPole);
        arm.position.set(armLength / 2 - 0.5, poleHeight - 3, 0);
        equipGroup.add(arm);

        // --- 雷达波束 ---
        const beamMat = new THREE.MeshBasicMaterial({ 
            color: colors.beam, transparent: true, opacity: 0.4, depthWrite: false, side: THREE.DoubleSide
        });

        function createSensorData(offsetX, isAngled, beamHeight, beamTipOffset) {
            const group = new THREE.Group();
            const sensor = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 2), new THREE.MeshLambertMaterial({color: 0x999999}));
            sensor.position.y = -0.5;
            group.add(sensor);

            const beamGeo = new THREE.ConeGeometry(2, beamHeight, 32);
            beamGeo.translate(0, -beamHeight/2, 0);
            const beam = new THREE.Mesh(beamGeo, beamMat);
            beam.position.y = beamTipOffset;
            if (isAngled) beam.rotation.x = Math.PI / 4;
            
            group.add(beam);
            group.position.set(offsetX, poleHeight - 3, 0);
            equipGroup.add(group);
            return { group, beam };
        }

        const levelSensor = createSensorData(armLength * 0.55, false, 29, -1);
        const flowSensor = createSensorData(armLength * 0.85, true, 35, -1);


        // --- 水流方向箭头 ---
        const arrows = [];
        const arrowGroup = new THREE.Group();
        sceneGroup.add(arrowGroup);
        const arrowMat = new THREE.MeshBasicMaterial({ color: colors.arrow, side: THREE.DoubleSide });

        function createArrow() {
            const group = new THREE.Group();
            const shaft = new THREE.Mesh(new THREE.BoxGeometry(1, 0.06, 3), arrowMat);
            group.add(shaft);
            const tri = new THREE.Shape();
            tri.moveTo(0, 1.3); tri.lineTo(-1, -1); tri.lineTo(1, -1); tri.closePath();
            const head = new THREE.Mesh(new THREE.ShapeGeometry(tri), arrowMat);
            head.rotation.x = Math.PI / 2; 
            head.position.z = 1.5 + 1;
            group.add(head);
            return group;
        }

        const arrowPositions = [ { x: -5, z: -25 }, { x: 0, z: -18 }, { x: 5, z: -11 } ];
        arrowPositions.forEach(pos => {
            const arr = createArrow();
            arr.position.set(pos.x, 0, pos.z);
            arrowGroup.add(arr);
            arrows.push(arr);
        });

        // --- UI 及水面动态调节核心逻辑 ---

        const domLabels = {
            level: document.getElementById('label-level'),
            flow: document.getElementById('label-flow'),
            egauge: document.getElementById('label-egauge')
        };

        const slider = document.getElementById('water-slider');
        const autoBtn = document.getElementById('auto-btn');
        const warningBadge = document.getElementById('warning-badge');
        const warningText = document.getElementById('warning-text');
        const warningIcon = document.getElementById('warning-icon');

        function setWaterLevel(h) {
            const yLevel = h - 8.0; 
            water.position.y = yLevel;
            arrows.forEach(arr => arr.position.y = yLevel + 0.15);

            let currentHalfWidth = 10;
            const shape = new THREE.Shape();
            shape.moveTo(-10, -3.0);
            shape.lineTo(10, -3.0);

            if (yLevel <= 8.0) {
                currentHalfWidth = 10 + (yLevel + 3.0) * (11.31 / 11.0);
                shape.lineTo(currentHalfWidth, yLevel);
                shape.lineTo(-currentHalfWidth, yLevel);
            } else if (yLevel <= 9.5) {
                currentHalfWidth = 21.31;
                shape.lineTo(21.31, 8.0);
                shape.lineTo(21.31, yLevel);
                shape.lineTo(-21.31, yLevel);
                shape.lineTo(-21.31, 8.0);
            } else {
                currentHalfWidth = 21.31 + (yLevel - 9.5) * 4; 
                if (currentHalfWidth > 39.31) currentHalfWidth = 39.31; 
                
                shape.lineTo(21.31, 8.0);
                shape.lineTo(21.31, 9.5);
                shape.lineTo(currentHalfWidth, 9.5);
                shape.lineTo(currentHalfWidth, yLevel);
                
                shape.lineTo(-currentHalfWidth, yLevel);
                shape.lineTo(-currentHalfWidth, 9.5);
                shape.lineTo(-21.31, 9.5);
                shape.lineTo(-21.31, 8.0);
            }
            shape.closePath();

            // 更新水面与水体
            if (water.geometry) water.geometry.dispose();
            water.geometry = new THREE.PlaneGeometry(currentHalfWidth * 2, channelLength, 64, 128);

            if (waterBody.geometry) waterBody.geometry.dispose();
            waterBody.geometry = new THREE.ExtrudeGeometry(shape, { depth: channelLength, bevelEnabled: false });

            updateWarningUI(h);
        }

        function updateSliderBackground(val) {
            const min = parseFloat(slider.min);
            const max = parseFloat(slider.max);
            const percentage = ((val - min) / (max - min)) * 100;
            slider.style.background = `linear-gradient(to right, #1e88e5 ${percentage}%, #e0e0e0 ${percentage}%)`;
        }

        function updateWarningUI(level) {
            let text = '';
            let bgColor = '';
            let icon = '🌊';

            if (level < 9.5) {
                text = `正常水位 (${level.toFixed(1)}cm) - 未达预警`;
                bgColor = '#4caf50'; // 绿色表示安全
                icon = '✅';
            } else if (level < 10.0) {
                text = `蓝色预警 (${level.toFixed(1)}cm)`;
                bgColor = '#1e90ff';
                icon = '🔵';
            } else if (level < 13.0) {
                text = `黄色预警 (${level.toFixed(1)}cm) - 水位上涨`;
                bgColor = '#ffb300';
                icon = '⚠️';
            } else if (level < 16.0) {
                text = `橙色预警 (${level.toFixed(1)}cm) - 接近漫堤`;
                bgColor = '#ff8c00';
                icon = '🟠';
            } else {
                text = `红色预警 (${level.toFixed(1)}cm) - 洪水漫溢`;
                bgColor = '#dc143c';
                icon = '🚨';
            }

            warningText.innerText = text;
            warningIcon.innerText = icon;
            warningBadge.style.backgroundColor = bgColor;
        }

        // 初始化
        setWaterLevel(parseFloat(slider.value));
        updateSliderBackground(parseFloat(slider.value));

        slider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            updateSliderBackground(val);
            setWaterLevel(val);
        });

        let isAutoPlaying = false;

        autoBtn.addEventListener('click', () => {
            isAutoPlaying = !isAutoPlaying;
            if (isAutoPlaying) {
                if (parseFloat(slider.value) >= parseFloat(slider.max)) {
                    slider.value = slider.min;
                    setWaterLevel(parseFloat(slider.min));
                    updateSliderBackground(parseFloat(slider.min));
                }
                autoBtn.innerHTML = '停止<br>演示';
                autoBtn.style.backgroundColor = '#E74C3C'; 
            } else {
                autoBtn.innerHTML = '自动演示<br>洪水';
                autoBtn.style.backgroundColor = '#5DADE2';
            }
        });


        // --- 文本标签 3D 转换投影 ---
        const labelAnchors = {
            level: new THREE.Vector3(),
            flow: new THREE.Vector3(),
            egauge: new THREE.Vector3()
        };

        function updateLabelsPositions() {
            levelSensor.group.getWorldPosition(labelAnchors.level);
            labelAnchors.level.y -= 8; labelAnchors.level.x -= 3;

            flowSensor.group.getWorldPosition(labelAnchors.flow);
            labelAnchors.flow.y -= 3; labelAnchors.flow.x += 4;

            eGaugeGroup.getWorldPosition(labelAnchors.egauge);
            labelAnchors.egauge.y += 20; labelAnchors.egauge.x += 1.5;

            const tempV = new THREE.Vector3();

            for (const key in labelAnchors) {
                tempV.copy(labelAnchors[key]);
                tempV.project(camera);

                const x = (tempV.x * .5 + .5) * window.innerWidth;
                const y = (tempV.y * -.5 + .5) * window.innerHeight;

                const el = domLabels[key];
                if (tempV.z < 1 && x > 0 && x < window.innerWidth && y > 0 && y < window.innerHeight) {
                    el.style.left = `${x}px`;
                    el.style.top = `${y}px`;
                    el.style.opacity = 1;
                } else {
                    el.style.opacity = 0;
                }
            }
        }

        // --- 动画循环 ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            const time = clock.getElapsedTime();
            waterShaderMat.uniforms.uTime.value = time;

            arrows.forEach(arrow => {
                arrow.position.z += 0.1;
                if (arrow.position.z > 30) arrow.position.z = -30;
            });

            const pulse = Math.sin(time * 3) * 0.05 + 1;
            const opacityPulse = Math.sin(time * 3) * 0.1 + 0.5;
            levelSensor.beam.scale.set(pulse, 1, pulse);
            levelSensor.beam.material.opacity = opacityPulse;
            flowSensor.beam.scale.set(pulse, 1, pulse);
            flowSensor.beam.material.opacity = opacityPulse;

            if (isAutoPlaying) {
                let currentVal = parseFloat(slider.value);
                const step = 0.05; 
                currentVal += step; 
                
                if (currentVal >= parseFloat(slider.max)) {
                    currentVal = parseFloat(slider.max);
                    isAutoPlaying = false; 
                    autoBtn.innerHTML = '自动演示<br>洪水';
                    autoBtn.style.backgroundColor = '#5DADE2';
                }
                
                slider.value = currentVal;
                updateSliderBackground(currentVal);
                setWaterLevel(currentVal);
            }

            updateLabelsPositions();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.top = d;
            camera.bottom = -d;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateLabelsPositions();
        }

        setTimeout(() => {
            updateLabelsPositions();
        }, 500);

        animate();

    </script>
</body>
</html>
